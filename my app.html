<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *
        {
            margin: auto;
        }
        ul
        {
            background-color: blue;
            padding: 5px;
        }
        li
        {
            list-style: none;
            display: block;
            padding: 12px;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            color: white;
        }
        nav
        {
            text-align: center;
            background-color: red;
            padding: 10px 5px;
            position: relative;
            top: 40px;
        }
        a
        {
            font-size: 18px;
            color: yellow;
            background-color: rgb(27, 2, 48);
            text-align: center;
            padding: 10px 50px;
            font-family: sans-serif;
            font-weight: bold;  
        }
        a:hover
        {
            color: blue;
            background-color: white;
            border: 1px solid green;
            background-size: 4px 8px;
            border-radius: 10px;
        }
        a:active
        {
            background-color: rgb(220, 14, 202);
        }
        .box
        {
            width: 400px;
            height: 400px;
            border: 2px solid;
            position: relative;
            top: 70px;
            background-color: lightblue;
            border-radius: 20px;
        }
        h1
        {
            text-align: center;
            background-color: rgb(245, 233, 4);
            padding: 2px 5px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
            color: rgb(8, 164, 8);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            border-bottom: 2px solid black;
        }
        h2
        {
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana;
            color: red;
            font-weight: bold;
            padding: 10px 5px;
        }
        span
        {
            color: black;
            font-size: 25px;
            font-weight: bold;
        }
        input
        {
            width: 250px;
            height: 30px;
            border-radius: 5px;
            font-size: 18px;
            padding: 5px;
            margin-left: 70px;
        }
        button
        {
            width: 100px;
            height: 40px;
            font-size: 20px;
            font-weight: bold;
            background-color: green;
            color: white;
            border-radius: 10px;
            position: relative;
            left: 150px;
        }
        button:hover
        {
            background-color: yellow;
            color: black;
            border: 2px solid red;
            border-radius: 15px;
        }
        button:active
        {
            background-color: blue;
            color: white;
        }
        .main
        {
            display: flex;
            width: 800px;
            height: 400px;
            border: 2px solid black;
            position: relative;
            top: 100px;
            left: 100px;
            border-radius: 20px;
            background-color: rgb(228, 13, 13);
        }
        .box1
        {
            width: 400px;
            height: 400px;
            border-right: 2px solid black;
            background-color: lightgreen;
            border-top-left-radius: 20px;
            border-bottom-left-radius: 20px;
            position: absolute;
        }
        .box2
        {
            width: 400px;
            height: 400px;
            background-color: lightblue;
            border-top-right-radius: 20px;
            border-bottom-right-radius: 20px;
            position: absolute;
            left: 400px;
            overflow: auto;
            border: 2px solid black;
            border-top-left-radius: 20px;
            border-bottom-left-radius: 20px;
        }
    </style>

</head>
<body>
    <ul>
        <li>Home</li>
        <li>About</li>
        <li>Contact</li>
        <li>Account</li>
    </ul>
    <nav>
        <a href="">Home</a>
        <a href="">About</a>
        <a href="">Contact</a>
        <a href="">Account</a>
    </nav>
    <div class="box">
        <form action="index.html">
        <h1>Welcome to My App</h1>
        <h2>Enter user name <span>*</span></h2>
        <input type="text">
        <h2>Enter Email <span>*</span></h2>
        <input type="email">
        <h2>Enter Password <span>*</span></h2>
        <input type="password"><br><br>
        <button type="submit">Enter</button>
        </form>
    </div>
    <div class="main">
        <div class="box1">
            <h1></h1>
        </div>
        <div class="box2"> 
    
</body>
</html>
