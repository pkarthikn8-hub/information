<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <style>
        .main
        {
            position: relative;
            display: grid;
            grid-template-columns: auto auto auto auto auto auto;
            row-gap: 10px;
            background-color: blue;
        }
        .box
        {
            width: 100px;
            height: 160px;
            text-align: center;
            border: 2px white;
            background-color: lightgray;
            box-shadow: 20px rgb(0, 0, 0);
            
        }
        img
        {
            width: 95px;
            height: 90px;
            border: 2px white;
            align-items: center;
            padding: 2px;
        }
        .box:hover
        {
            background-color: orange;
        }
        button
        {
            background-color: green;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px; 
        }
        button:hover
        {
            background-color: yellow;
        }
       
    </style>
</head>

</html>
